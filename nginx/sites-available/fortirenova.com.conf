server {
	listen 80;
	listen [::]:80;

	server_name fortirenova.com www.fortirenova.com;

    include /etc/nginx/snippets/common-headers.conf;
	return 302 https://$host$request_uri;

	root /usr/share/nginx/fortirenova.com/html;
	index index.html index.htm;

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ =404;
		# Uncomment to enable naxsi on this location
		# include /etc/nginx/naxsi.rules
	}

	error_page 404 /404.html;

	# redirect server error pages to the static page /50x.html
	#
	error_page 500 502 503 504 /50x.html;
	location = /50x.html {
		root /usr/share/nginx/fortirenova.com/html;
	}
}

# HTTPS server
#
server {
	listen 443 ssl;
	listen [::]:443 ssl;
    http2 on;
	server_name fortirenova.com;

	root /usr/share/nginx/fortirenova.com/html;
	index index.html index.htm;

    include /etc/nginx/snippets/common-headers.conf;
    include /etc/nginx/snippets/common-ssl-settings.conf;

	location / {
        add_header X-Location-Match "STEVE_PROXY" always;
		try_files $uri $uri/ =404;
	}

	error_page 404 /404.html;

	# redirect server error pages to the static page /50x.html
	#
	error_page 500 502 503 504 /50x.html;
	location = /50x.html {
		root /usr/share/nginx/fortirenova.com/html;
	}
}
