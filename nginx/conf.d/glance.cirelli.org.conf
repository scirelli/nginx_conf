server {
	listen 80;
	listen [::]:80;

	server_name glance.steve.cirelli.org glance.cirelli.org;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;

	server_name glance.steve.cirelli.org glance.cirelli.org;

	include /etc/nginx/snippets/common-headers.conf;
	include /etc/nginx/snippets/common-ssl-settings.conf;
	add_header X-Location-Match "GLANCE_PROXY" always;

	location ^~ / {
		proxy_pass http://glance:8080;
	}
}
