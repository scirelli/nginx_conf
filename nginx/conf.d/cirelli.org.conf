server {
	listen 80 default_server;
	listen [::]:80 default_server;

	server_name cirelli.org _;

	return 301 https://$host$request_uri;
}

# HTTPS server
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	http2 on;

	server_name cirelli.org _;

	root /usr/share/nginx/cirelli.org/html;
	index index.html index.htm;

	include /etc/nginx/snippets/common-headers.conf;
	include /etc/nginx/snippets/common-ssl-settings.conf;
	add_header X-Location-Match "DEFAULT_PROXY" always;

	location / {
		try_files $uri $uri/ =404;
	}

	error_page 404 /404.html;

	# redirect server error pages to the static page /50x.html
	error_page 500 502 503 504 /50x.html;
	location = /50x.html {
		root /usr/share/nginx/cirelli.org/html;
	}
}
